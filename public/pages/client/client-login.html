<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - Promaths Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/client-login.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
            min-height: 100vh;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .google-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
            transition: all 0.3s ease;
            border: none;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
        }
        .text-gradient {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating-element {
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-violet-600/10 rounded-full blur-3xl floating-element"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl floating-element" style="animation-delay: 2s;"></div>
        <div class="absolute top-3/4 left-3/4 w-48 h-48 bg-purple-600/10 rounded-full blur-3xl floating-element" style="animation-delay: 4s;"></div>
    </div>

    <!-- Simple Login Card -->
    <div class="login-card w-full max-w-md p-8 fade-in relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-violet-600 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg transform hover:scale-110 transition-transform duration-300">
                <img 
                    src="../../images/Wits-Promaths-logo.jpeg" 
                    alt="Promaths Logo"
                    class="w-12 h-12 object-contain rounded-lg"
                />
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Promaths <span class="text-gradient">Bridge</span></h1>
            <p class="text-gray-300">Sign in to your mentorship account</p>
        </div>

        <!-- Welcome Message -->
        <div class="bg-gradient-to-r from-violet-900/30 to-blue-900/30 rounded-lg p-4 mb-6 border border-white/10">
            <div class="flex items-start space-x-3">
                <i class="fas fa-info-circle text-blue-400 mt-1"></i>
                <p class="text-sm text-gray-300">
                    Sign in with your university email to access your mentorship dashboard, track progress, and connect with your mentor/mentee.
                </p>
            </div>
        </div>

        <!-- Google Login Button -->
        <button 
            type="button" 
            id="googleLoginBtn"
            class="w-full google-btn font-medium py-4 px-4 rounded-xl flex items-center justify-center mb-4 text-white text-lg transition-all duration-300 shadow-lg"
        >
            <svg class="w-6 h-6 mr-3" viewBox="0 0 24 24">
                <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <!-- Email Sign In Option (Hidden by default, can be enabled) -->
        <div class="relative mb-6 hidden">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-gray-800 text-gray-400">Or continue with email</span>
            </div>
        </div>

        <!-- Info Cards -->
        <div class="grid grid-cols-2 gap-3 mt-6">
            <div class="bg-white/5 rounded-lg p-3 text-center">
                <i class="fas fa-user-graduate text-blue-400 mb-1"></i>
                <p class="text-xs text-gray-400">Mentors</p>
            </div>
            <div class="bg-white/5 rounded-lg p-3 text-center">
                <i class="fas fa-users text-violet-400 mb-1"></i>
                <p class="text-xs text-gray-400">Mentees</p>
            </div>
        </div>

        <!-- Loading State (Hidden by default) -->
        <div id="loadingState" class="hidden mt-6">
            <div class="flex flex-col items-center justify-center py-4">
                <div class="w-12 h-12 border-4 border-violet-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-gray-400 mt-3 text-sm">Signing you in...</p>
            </div>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="errorMessage" class="hidden mt-6 bg-red-900/50 border border-red-700 rounded-lg p-4">
            <div class="flex items-center space-x-3">
                <i class="fas fa-exclamation-circle text-red-400"></i>
                <p class="text-red-400 text-sm" id="errorText"></p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pt-6 border-t border-gray-700">
            <p class="text-gray-400 text-sm">
                © 2026 Promaths Bridge. All rights reserved.
            </p>
            <div class="flex justify-center space-x-4 mt-3">
                <a href="/" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">
                    <i class="fas fa-home mr-1"></i>Home
                </a>
                <span class="text-gray-700">•</span>
                <a href="#" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">
                    <i class="fas fa-question-circle mr-1"></i>Help
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="../../scripts/client/clientLogin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Promaths</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/admin-login.css">
</head>
<body class="flex items-center justify-center p-4">
    <!-- Simple Login Card -->
    <div class="login-card w-full max-w-md p-8 fade-in">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-violet-600 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-lock text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Admin <span class="text-gradient">Portal</span></h1>
            <p class="text-gray-300">Sign in to your account</p>
        </div>

        <!-- Google Login Button -->
        <button 
            type="button" 
            id="googleLoginBtn"
            class="w-full google-btn font-medium py-3 px-4 rounded-lg flex items-center justify-center mb-6"
        >
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
                <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <!-- Divider -->
        <div class="divider mb-6">
            <span class="text-sm">Or continue with email</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <!-- Email Field -->
            <div>
                <label class="block text-gray-300 font-medium mb-2 text-sm" for="email">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    class="w-full px-4 py-3 input-field rounded-lg"
                    placeholder="admin@promaths.edu"
                    required
                >
            </div>

            <!-- Password Field -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-gray-300 font-medium text-sm" for="password">
                        Password
                    </label>
                    <button type="button" id="togglePassword" class="text-blue-400 hover:text-blue-300 text-sm">
                        Show
                    </button>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    class="w-full px-4 py-3 input-field rounded-lg"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 text-blue-400 rounded bg-gray-800 border-gray-700">
                <label for="remember" class="ml-2 text-gray-300 text-sm">
                    Remember me
                </label>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="loginBtn"
                class="w-full btn-primary font-bold py-3 rounded-lg mt-2"
            >
                <span id="btnText">Sign In</span>
                <div id="loadingSpinner" class="hidden">
                    <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>
                </div>
            </button>
        </form>

        <!-- Forgot Password -->
        <div class="text-center mt-6">
            <a href="#" class="text-blue-400 hover:text-blue-300 text-sm">
                Forgot your password?
            </a>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pt-6 border-t border-gray-700">
            <p class="text-gray-400 text-sm">
                © 2026 Promaths Bridge. All rights reserved.
            </p>
        </div>
    </div>

 
</body>
</html>
